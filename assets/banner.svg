<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#titleGrad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .tag {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 2px;
    }
    .card-label {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      fill: #64748b;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .card-val {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 700;
      fill: #f8fafc;
    }

    /* Dynamic / Animated Elements */
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes waveDash {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes signalPulse {
      0% { r: 4px; opacity: 1; }
      100% { r: 24px; opacity: 0; }
    }

    .bg-wave {
      stroke: #38bdf8;
      stroke-width: 2;
      stroke-dasharray: 8 6;
      fill: none;
      opacity: 0.35;
      animation: waveDash 30s linear infinite;
    }
    .bg-wave-2 {
      stroke: #818cf8;
      stroke-width: 1.5;
      stroke-dasharray: 4 4;
      fill: none;
      opacity: 0.25;
      animation: waveDash 20s linear infinite reverse;
    }
    .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 8s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 7s ease-in-out infinite 2s; }
    .pulse-ring {
      animation: signalPulse 2.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
  </style>

  <!-- Background Rect -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Dynamic Waveform & Telemetry Background Graphics (Behind text) -->
  <g opacity="0.6">
    <path class="bg-wave" d="M0,220 Q150,150 300,220 T600,220 T900,220 T1200,220" />
    <path class="bg-wave-2" d="M0,250 Q200,310 400,240 T800,260 T1200,230" />
    
    <!-- Dynamic Glowing Signal Nodes -->
    <g transform="translate(180, 220)">
      <circle class="pulse-ring" cx="0" cy="0" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#38bdf8" filter="url(#softGlow)"/>
    </g>
    <g transform="translate(600, 220)">
      <circle class="pulse-ring" cx="0" cy="0" fill="none" stroke="#818cf8" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#818cf8" filter="url(#softGlow)"/>
    </g>
    <g transform="translate(950, 220)">
      <circle class="pulse-ring" cx="0" cy="0" fill="none" stroke="#c084fc" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#c084fc" filter="url(#softGlow)"/>
    </g>

    <!-- Dynamic Floating Ambient Particles -->
    <circle class="particle-1" cx="120" cy="80" r="3" fill="#38bdf8" />
    <circle class="particle-2" cx="1080" cy="90" r="4" fill="#818cf8" />
    <circle class="particle-3" cx="1020" cy="280" r="3" fill="#c084fc" />
    <circle class="particle-1" cx="220" cy="300" r="2.5" fill="#38bdf8" />
  </g>

  <!-- FOREGROUND CONTENT: Header Tag, Title, Subtitle, & Metric Cards (Positioned clearly above dynamic elements) -->
  <!-- Header Tag Pill -->
  <g transform="translate(600, 55)">
    <rect x="-180" y="-16" width="360" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#softGlow)"/>
    <text class="tag" x="0" y="5" text-anchor="middle">⚙️ INDUSTRIAL IOT &amp; APM ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text class="title" x="600" y="130" text-anchor="middle" filter="url(#glow)">Awesome Equipment Performance Monitoring</text>
  
  <!-- Subtitle -->
  <text class="subtitle" x="600" y="172" text-anchor="middle">Curated SaaS Platforms &amp; Open-Source Projects for Industrial Analytics, OEE &amp; PdM</text>

  <!-- Dynamic Key Metric Cards (Foreground Dashboard Preview) -->
  <g transform="translate(600, 275)">
    <!-- Card 1: OEE -->
    <g transform="translate(-320, 0)">
      <rect x="-100" y="-35" width="200" height="70" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
      <text class="card-label" x="0" y="-10" text-anchor="middle">⚡ OVERALL OEE</text>
      <text class="card-val" x="0" y="18" text-anchor="middle" fill="#34d399">89.4% <tspan font-size="12" fill="#10b981">↑ +3.2%</tspan></text>
    </g>

    <!-- Card 2: Uptime & Reliability -->
    <g transform="translate(0, 0)">
      <rect x="-100" y="-35" width="200" height="70" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
      <text class="card-label" x="0" y="-10" text-anchor="middle">🛡️ ASSET UPTIME</text>
      <text class="card-val" x="0" y="18" text-anchor="middle" fill="#38bdf8">99.85% <tspan font-size="12" fill="#38bdf8">Active</tspan></text>
    </g>

    <!-- Card 3: Predictive Anomaly Detection -->
    <g transform="translate(320, 0)">
      <rect x="-100" y="-35" width="200" height="70" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
      <text class="card-label" x="0" y="-10" text-anchor="middle">🔮 PDM HEALTH INDEX</text>
      <text class="card-val" x="0" y="18" text-anchor="middle" fill="#a78bfa">94 / 100 <tspan font-size="12" fill="#a78bfa">Optimal</tspan></text>
    </g>
  </g>
</svg>
