<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#070a12"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1f2937" stop-opacity=".8"/><stop offset="100%" stop-color="#111827" stop-opacity=".9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.05)}}@keyframes waveDash{0%{stroke-dashoffset:1000}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.2}50%{transform:translateY(-15px) translateX(10px);opacity:.8}}@keyframes signalPulse{0%{r:4px;opacity:1}}.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:42px;fill:url(#titleGrad)}.subtitle{font-weight:500;font-size:19px;fill:#94a3b8}.tag{font-weight:700;font-size:13px;fill:#38bdf8;letter-spacing:2px}.card-label,.card-val,.tag{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.card-label{font-size:12px;fill:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:1px}.card-val{font-size:20px;font-weight:700;fill:#f8fafc}.bg-wave{stroke:#38bdf8;stroke-width:2;stroke-dasharray:8 6;fill:none;opacity:.35;animation:waveDash 30s linear infinite}.bg-wave-2{stroke:#818cf8;stroke-width:1.5;stroke-dasharray:4 4;fill:none;opacity:.25;animation:waveDash 20s linear infinite reverse}.particle-1{animation:floatParticle 6s ease-in-out infinite}.particle-2{animation:floatParticle 8s ease-in-out infinite 1s}.particle-3{animation:floatParticle 7s ease-in-out infinite 2s}.pulse-ring{animation:signalPulse 2.5s cubic-bezier(.215,.61,.355,1) infinite}</style><rect width="1200" height="360" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" rx="16"/><g opacity=".6"><path d="M0,220 Q150,150 300,220 T600,220 T900,220 T1200,220" class="bg-wave"/><path d="M0,250 Q200,310 400,240 T800,260 T1200,230" class="bg-wave-2"/><g transform="translate(180, 220)"><circle cx="0" cy="0" fill="none" stroke="#38bdf8" stroke-width="2" class="pulse-ring"/><circle cx="0" cy="0" r="5" fill="#38bdf8" filter="url(#softGlow)"/></g><g transform="translate(600, 220)"><circle cx="0" cy="0" fill="none" stroke="#818cf8" stroke-width="2" class="pulse-ring"/><circle cx="0" cy="0" r="5" fill="#818cf8" filter="url(#softGlow)"/></g><g transform="translate(950, 220)"><circle cx="0" cy="0" fill="none" stroke="#c084fc" stroke-width="2" class="pulse-ring"/><circle cx="0" cy="0" r="5" fill="#c084fc" filter="url(#softGlow)"/></g><circle cx="120" cy="80" r="3" fill="#38bdf8" class="particle-1"/><circle cx="1080" cy="90" r="4" fill="#818cf8" class="particle-2"/><circle cx="1020" cy="280" r="3" fill="#c084fc" class="particle-3"/><circle cx="220" cy="300" r="2.5" fill="#38bdf8" class="particle-1"/></g><g transform="translate(600, 55)"><rect width="360" height="32" x="-180" y="-16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#softGlow)" rx="16"/><text x="0" y="5" class="tag" text-anchor="middle">⚙️ INDUSTRIAL IOT &amp; APM ECOSYSTEM</text></g><text x="600" y="130" class="title" filter="url(#glow)" text-anchor="middle">Awesome Equipment Performance Monitoring</text><text x="600" y="172" class="subtitle" text-anchor="middle">Curated SaaS Platforms &amp; Open-Source Projects for Industrial Analytics, OEE &amp; PdM</text><g><g transform="translate(600, 275) translate(-320, 0)"><rect width="200" height="70" x="-100" y="-35" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" rx="12"/><text x="0" y="-10" class="card-label" text-anchor="middle">⚡ OVERALL OEE</text><text x="0" y="18" fill="#34d399" class="card-val" text-anchor="middle">89.4% <tspan fill="#10b981" font-size="12">↑ +3.2%</tspan></text></g><g transform="translate(600, 275) translate(0, 0)"><rect width="200" height="70" x="-100" y="-35" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" rx="12"/><text x="0" y="-10" class="card-label" text-anchor="middle">🛡️ ASSET UPTIME</text><text x="0" y="18" fill="#38bdf8" class="card-val" text-anchor="middle">99.85% <tspan fill="#38bdf8" font-size="12">Active</tspan></text></g><g transform="translate(600, 275) translate(320, 0)"><rect width="200" height="70" x="-100" y="-35" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" rx="12"/><text x="0" y="-10" class="card-label" text-anchor="middle">🔮 PDM HEALTH INDEX</text><text x="0" y="18" fill="#a78bfa" class="card-val" text-anchor="middle">94 / 100 <tspan fill="#a78bfa" font-size="12">Optimal</tspan></text></g></g></svg>